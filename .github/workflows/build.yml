name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Same toolchain as a local build (see README): Rust gnullvm host + llvm-mingw UCRT.
  LLVM_MINGW_VERSION: "20261117"
  LLVM_MINGW: llvm-mingw-20261117-ucrt-x86_64
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install llvm-mingw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$LLVM_MINGW_VERSION" -R mstorsjo/llvm-mingw \
            -p "$LLVM_MINGW.zip" -D "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/$LLVM_MINGW.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$LLVM_MINGW/bin" >> "$GITHUB_PATH"

      - name: Install Rust (gnullvm host)
        run: |
          rustup set default-host x86_64-pc-windows-gnullvm
          rustup toolchain install stable --profile minimal -c clippy,rustfmt
          rustup default stable
          rustc -vV

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

      - uses: actions/upload-artifact@v7
        with:
          name: t3-dock-${{ github.sha }}
          path: target/release/t3-dock.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: t3-dock-${{ github.sha }}
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" t3-dock.exe -R "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes
