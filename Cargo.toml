[package]
name = "t3-dock"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shows T3 Code agent threads on a MiraBox N3 and focuses one on key press"
publish = false

[dependencies]
cosmic-text = "0.19"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
jiff = "1"
mirajazz = "0.16.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
# No TLS: t3-dock only talks plain HTTP to loopback.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
tray-icon = { version = "0.26", default-features = false }
ureq = { version = "3", default-features = false }

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tokio = { version = "1", features = ["io-util", "net"] }

[profile.release]
lto = "thin"
strip = true
